<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="min-vh-100 d-flex align-items-center" style="background-image: url(https://i.pinimg.com/736x/69/f5/34/69f534f826813bd666e0b24b92ba1890.jpg); background-repeat: no-repeat; background-size: cover; background-position: center;">
    <div class="container border border-none shadow p-5 col-12 col-md-8 col-lg-6 rounded-4 bg-white">
        <form method="post" action="{{ url_for('signup') }}">
            <h4>Iniciar Sesión</h4>

            {% with mensajes = get_flashed_messages(with_categories=true) %}
              {% for categoria, mensaje in mensajes %}
                <div class="alert alert-{{ categoria }} mt-3" role="alert">{{ mensaje }}</div>
              {% endfor %}
            {% endwith %}

            {% if error %}
            <div class="alert alert-danger mt-3" role="alert">{{ error }}</div>
            {% endif %}

            <div class="mt-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" name="email" class="form-control rounded-3 shadow" placeholder="E-mail" required>
            </div>

            <div class="mt-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control rounded-3 shadow" placeholder="Contraseña" required>
            </div>

            <button type="submit" class="btn btn-outline-secondary mt-4 bg-success-subtle border border-none shadow">Iniciar Sesión</button>
        </form>

        <a href="{{ url_for('register') }}" class="d-inline-block mt-3">Crear Cuenta</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
