<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-success-subtle">

    <!--su navbar-->
    <nav class="navbar navbar-expand-lg bg-success border rounded-bottom-4 navbar-dark p-3">
        <div class="container-fluid">   
            
            <img src="{{url_for ('static', filename= 'img/logoesc.png')}}" alt="logo escuela Rotario" style="height: 50px; width: auto;">
            <a class="navbar-brand h3 mb-0 me-4 ms-2 text-white fw-bold" href="{{url_for ('inicio') }}">Biblioteca Rotario</a>

        <!-- Esto es para el menú desplegable -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <!-- Enlaces del menú -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 list-unstyled">
                    <li class="nav-item"><a href="{{url_for ('inicio')}}" class="nav-link text-white">Inicio</a></li>
                    <li class="nav-item"><a href="{{url_for ('libros')}}" class="nav-link text-white">Libros</a></li>
                    <li class="nav-item"><a href="{{url_for ('historial') }}" class="nav-link text-white">Historial</a></li>
                    <li class="nav-item"><a href="{{url_for ('escaneo_libro') }}" class="nav-link text-white">Escanear</a></li>
                    <li class="nav-item"><a href="{{url_for ('cuenta') }}" class="nav-link text-white">Cuenta</a></li>
                    <li class="nav-item">
                        {% if session.get('user_id') %}
                        <form method="post" action="{{ url_for('logout') }}" class="d-inline">
                            <button type="submit" class="nav-link text-white bg-transparent border-0">Cerrar Sesión</button>
                        </form>
                        {% else %}
                        <a href="{{ url_for('signup') }}" class="nav-link text-white">Iniciar Sesión</a>
                        {% endif %}
                    </li>
                </ul>

                <!-- Buscador: lleva a la página de Libros con los resultados -->
                <form class="d-flex" role="search" method="get" action="{{ url_for('libros') }}">
                    <input class="form-control rounded-5 me-2" type="search" name="q" placeholder="Buscar.." aria-label="Buscar">
                    <button class="btn btn-outline-secondary bg-white text-dark" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>


    <div class="container border border-none shadow mt-4 p-4 col-6 rounded-4 bg-white">
        <div class="row">
            <h4 class="mt-1">Detalles de Cuenta</h4>
            <p class="mt-3">Nombre: <span id="nombreCuenta">{{ nombre }}</span></p>
            <p class="mt-3 mb-0">E-mail: <span id="emailCuenta">{{ email }}</span></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
